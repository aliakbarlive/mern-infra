name: CI

on:
  pull_request:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build + Typecheck + Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Enable Corepack + Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (API)
        run: pnpm --filter @app/api exec tsc -p apps/api/tsconfig.json --noEmit

      - name: Typecheck (Web)
        run: pnpm --filter @app/web exec tsc -p apps/web/tsconfig.json --noEmit

      - name: Test (API)
        run: pnpm --filter @app/api -if-present test

      - name: Build (Shared)
        run: pnpm --filter @repo/shared -if-present build

      - name: Build (API)
        run: pnpm --filter @app/api build

      - name: Build (Web)
        run: pnpm --filter @app/web build

      - name: Docker build API (sanity)
        run: docker build -f Dockerfile.api -t mern-api:ci .

      - name: Docker build Web (sanity)
        run: docker build -f Dockerfile.web -t mern-web:ci .
