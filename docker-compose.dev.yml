version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    ports:
      - "4000:4000"
    env_file:
      - apps/api/.env
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: dev
    ports:
      - "5173:5173"
    env_file:
      - apps/web/.env
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - api

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: